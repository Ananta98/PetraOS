[package]
name = "petraos-kernel"
version = "0.1.0"
edition = "2024"

[features]
binary-only = []
sched-trace = []

[dependencies]
limine = "0.5"
log = "0.4"
bitflags = "2.4"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "petraos-kernel"
path = "src/main.rs"
test = false
required-features = ["binary-only"]

[[test]]
name = "pmm"
path = "tests/mm/pmm.rs"

[[test]]
name = "heap"
path = "tests/mm/heap.rs"

[[test]]
name = "vma"
path = "tests/mm/vma.rs"

[[test]]
name = "sched_cfs"
path = "tests/sched/cfs.rs"

[[test]]
name = "sched_rt"
path = "tests/sched/rt.rs"

[[test]]
name = "sched_policy"
path = "tests/sched/policy.rs"

[[test]]
name = "sched_scheduler"
path = "tests/sched/scheduler.rs"

[[test]]
name = "proc_context_switch"
path = "tests/proc/context_switch.rs"

[[test]]
name = "proc_syscall"
path = "tests/proc/syscall.rs"

[[test]]
name = "fs_flags"
path = "tests/fs/flags.rs"

[[test]]
name = "fs_fd_table"
path = "tests/fs/fd_table.rs"

[[test]]
name = "fs_ramfs"
path = "tests/fs/ramfs.rs"

[[test]]
name = "fs_devfs"
path = "tests/fs/devfs.rs"

[[test]]
name = "fs_procfs"
path = "tests/fs/procfs.rs"

[[test]]
name = "fs_tmpfs"
path = "tests/fs/tmpfs.rs"

[[test]]
name = "fs_path_lookup"
path = "tests/fs/path_lookup.rs"