[package]
name = "petraos-kernel"
version = "0.1.0"
edition = "2024"

[features]
binary-only = []
sched-trace = []

[dependencies]
limine = "0.5"
log = "0.4"
bitflags = "2.4"
flanterm = "0.0.2"
smoltcp = { version = "0.14.0", default-features = false, features = ["alloc", "log", "medium-ethernet", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-icmp", "socket-raw", "socket-dhcpv4", "proto-dhcpv4", "socket-dns", "proto-dns"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "petraos-kernel"
path = "src/main.rs"
test = false
required-features = ["binary-only"]
