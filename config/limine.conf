# Timeout in seconds that Limine will use before automatically booting.
timeout: 3

# The entry name that will be displayed in the boot menu.
/Limine Template
    # We use the Limine boot protocol.
    protocol: limine

    # Path to the kernel to boot. boot():/ represents the partition on which limine.conf is located.
    kernel_path: boot():/boot/kernel

    # Kernel boot command line: setup all user environment variables
    cmdline: PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin TERM=linux HOME=/root USER=root LOGNAME=root SHELL=/bin/bash "PS1=\u@\h:\w\$ " LINES=50 COLUMNS=142

    # Path to initramfs archive module
    module_path: boot():/boot/initramfs.cpio