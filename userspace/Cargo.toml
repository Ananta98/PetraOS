[workspace]
members = [
    "space-core",
    "space-hal",
    "space-ui",
    "space-compositor",
    "apps/space-files",
    "apps/space-tasks",
    "apps/space-term",
    "apps/space-calc",
    "apps/space-pad",
    "apps/space-control",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
