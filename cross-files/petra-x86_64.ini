[binaries]
c = 'x86_64-linux-gnu-gcc'
cpp = 'x86_64-linux-gnu-g++'
ar = 'x86_64-linux-gnu-ar'
strip = 'x86_64-linux-gnu-strip'
pkg-config = 'pkg-config'

[properties]
needs_exe_wrapper = true
sys_root = '@SYSROOT_DIR@'

[host_machine]
system = 'petra'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
