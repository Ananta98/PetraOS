sources:
  - name: coreutils
    subdir: sources
    url: 'https://ftpmirror.gnu.org/coreutils/coreutils-9.1.tar.xz'
    format: 'tar.xz'
    extract_path: 'coreutils-9.1'
    version: '9.1'
    patch_path_strip: 1

packages:
  - name: coreutils
    architecture: x86_64
    from_source: coreutils
    tools_required:
      - host-gcc
      - host-binutils
    pkgs_required:
      - mlibc
      - tzdata
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-petra'
          - '--prefix=/usr'
          - '--disable-nls'
          - 'CFLAGS=-DSLOW_BUT_NO_HACKS -Wno-error -O2 -g -pipe'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'DESTDIR=@SYSROOT_DIR@', 'install']
    install:
      - args: ['make', 'DESTDIR=@SYSROOT_DIR@', 'install']
