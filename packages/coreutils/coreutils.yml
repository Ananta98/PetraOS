sources:
  - name: coreutils
    subdir: sources
    git: 'https://git.savannah.gnu.org/git/coreutils.git'
    tag: 'v9.1'
    version: '9.1'
    patch_path_strip: 1
    sources_required: ['gnulib']
    tools_required:
      - host-autoconf-v2.69
      - host-automake-v1.16
    regenerate:
      - args: ['rm', '-rf', 'gnulib']
      - args: ['cp', '-r', '@SOURCE_ROOT@/sources/gnulib', './']
      - args: ['./bootstrap']
      - args: ['cp',
               '@BUILD_ROOT@/tools/host-automake-v1.16/share/automake-1.16/config.sub',
               '@THIS_SOURCE_DIR@/build-aux/']

packages:
  - name: coreutils
    architecture: x86_64
    from_source: coreutils
    tools_required:
      - host-gcc
    pkgs_required:
      - mlibc
      - tzdata
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
      - args: ['make', 'src/make-prime-list']
      - args: |
          set -e
          ./src/make-prime-list 5000 > "@THIS_SOURCE_DIR@/src/primes.h"
          rm -rf *
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-petra'
          - '--prefix=/usr'
          - 'CFLAGS=-DSLOW_BUT_NO_HACKS -Wno-error -O2 -g -pipe'
    build:
      - args: ['make', '-j@PARALLELISM@']
    install:
      - args: ['make', 'DESTDIR=@SYSROOT_DIR@', 'install-strip']
