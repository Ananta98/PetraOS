sources:
  - name: fastfetch
    subdir: sources
    url: 'https://github.com/fastfetch-cli/fastfetch/archive/refs/tags/2.59.0.tar.gz'
    format: 'tar.gz'
    extract_path: 'fastfetch-2.59.0'
    version: '2.59.0'
    patch_path_strip: 1

packages:
  - name: fastfetch
    architecture: x86_64
    from_source: fastfetch
    tools_required:
      - host-gcc
    pkgs_required:
      - mlibc
    configure:
      - args:
          - cmake
          - -B
          - '@THIS_BUILD_DIR@'
          - -S
          - '@THIS_SOURCE_DIR@'
          - -DCMAKE_TOOLCHAIN_FILE=@SOURCE_ROOT@/cross-files/petra-x86_64.cmake
          - -DCMAKE_SYSROOT=@SYSROOT_DIR@
          - -DCMAKE_FIND_ROOT_PATH=@SYSROOT_DIR@
          - -DCMAKE_INSTALL_PREFIX=/usr
          - -DCMAKE_BUILD_TYPE=Release
          - -DBINARY_LINK_TYPE=dlopen
        environ:
          SYSROOT_DIR: '@SYSROOT_DIR@'
    build:
      - args:
          - cmake
          - --build
          - '@THIS_BUILD_DIR@'
          - -j@PARALLELISM@
    install:
      - args:
          - cmake
          - --install
          - '@THIS_BUILD_DIR@'
        environ:
          DESTDIR: '@SYSROOT_DIR@'
      - args: |
          mkdir -p @SYSROOT_DIR@/bin
          ln -sf /usr/bin/fastfetch @SYSROOT_DIR@/bin/fastfetch 2>/dev/null || true
          ln -sf /usr/bin/flashfetch @SYSROOT_DIR@/bin/flashfetch 2>/dev/null || true
      - args: |
          mkdir -p @SYSROOT_DIR@/etc/fastfetch
          cat > @SYSROOT_DIR@/etc/fastfetch/config.jsonc << 'EOF'
          {
            "$schema": "https://github.com/fastfetch-cli/fastfetch/raw/dev/doc/json_schema.json",
            "logo": {
              "source": "petra",
              "padding": { "top": 1, "right": 2 }
            },
            "general": {
              "processingTimeout": 500,
              "detectVersion": false,
              "thread": false
            },
            "display": {
              "separator": ": ",
              "showErrors": false
            },
            "modules": [
              "title",
              "separator",
              "os",
              "kernel",
              "uptime",
              "loadavg",
              "processes",
              {
                "type": "cpu",
                "showPeCoreCount": true
              },
              "memory",
              {
                "type": "swap",
                "separate": true
              },
              "disk",
              "shell",
              "terminal",
              "locale",
              "break",
              "colors"
            ]
          }
          EOF
          mkdir -p @SYSROOT_DIR@/usr/share/fastfetch/presets
          cp @SYSROOT_DIR@/etc/fastfetch/config.jsonc @SYSROOT_DIR@/usr/share/fastfetch/presets/petra.jsonc
          chmod 644 @SYSROOT_DIR@/etc/fastfetch/config.jsonc @SYSROOT_DIR@/usr/share/fastfetch/presets/petra.jsonc 2>/dev/null || true
