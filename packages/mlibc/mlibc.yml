sources:
  - name: mlibc
    subdir: sources
    git: https://github.com/managarm/mlibc.git
    branch: master
    patch_path_strip: 1

packages:
  - name: mlibc-headers
    architecture: x86_64
    from_source: mlibc
    configure:
      - args:
          - meson
          - setup
          - '@SOURCE_ROOT@/build-xbstrap/pkg-builds/mlibc-headers'
          - '@THIS_SOURCE_DIR@'
          - --cross-file=@SOURCE_ROOT@/cross-files/petra-x86_64.ini
          - --prefix=/usr
          - -Dheaders_only=true
    build:
      - args:
          - ninja
          - -C
          - '@SOURCE_ROOT@/build-xbstrap/pkg-builds/mlibc-headers'
      - args:
          - ninja
          - -C
          - '@SOURCE_ROOT@/build-xbstrap/pkg-builds/mlibc-headers'
          - install
        environ:
          DESTDIR: '@SOURCE_ROOT@/build-xbstrap/system-root'

  - name: mlibc
    architecture: x86_64
    from_source: mlibc
    pkgs_required:
      - mlibc-headers
    configure:
      - args:
          - meson
          - setup
          - '@SOURCE_ROOT@/build-xbstrap/pkg-builds/mlibc'
          - '@THIS_SOURCE_DIR@'
          - --cross-file=@SOURCE_ROOT@/cross-files/petra-x86_64.ini
          - --prefix=/usr
          - --default-library=both
          - -Dbuildtype=debugoptimized
    build:
      - args:
          - ninja
          - -C
          - '@SOURCE_ROOT@/build-xbstrap/pkg-builds/mlibc'
      - args:
          - ninja
          - -C
          - '@SOURCE_ROOT@/build-xbstrap/pkg-builds/mlibc'
          - install
        environ:
          DESTDIR: '@SOURCE_ROOT@/build-xbstrap/system-root'
