sources:
  - name: htop
    subdir: sources
    url: 'https://github.com/htop-dev/htop/releases/download/3.3.0/htop-3.3.0.tar.xz'
    format: 'tar.xz'
    extract_path: 'htop-3.3.0'
    version: '3.3.0'
    patch_path_strip: 1
    tools_required:
      - host-automake-v1.16
    regenerate:
      - args: ['sh', '-c',
               'cp @BUILD_ROOT@/tools/host-automake-v1.16/share/automake-1.16/config.sub @THIS_SOURCE_DIR@/build-aux/config.sub 2>/dev/null || cp @BUILD_ROOT@/tools/host-automake-v1.16/share/automake-1.16/config.sub @THIS_SOURCE_DIR@/config.sub 2>/dev/null || true']
      - args: ['sh', '-c',
               'cp @BUILD_ROOT@/tools/host-automake-v1.16/share/automake-1.16/config.guess @THIS_SOURCE_DIR@/build-aux/config.guess 2>/dev/null || cp @BUILD_ROOT@/tools/host-automake-v1.16/share/automake-1.16/config.guess @THIS_SOURCE_DIR@/config.guess 2>/dev/null || true']

packages:
  - name: htop
    architecture: x86_64
    from_source: htop
    tools_required:
      - host-gcc
    pkgs_required:
      - mlibc
      - ncurses
      - pkg-config
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-petra'
          - '--prefix=/usr'
          - '--sysconfdir=/etc'
          - '--enable-unicode'
          - '--disable-hwloc'
          - '--disable-delayacct'
          - '--disable-sensors'
          - '--disable-capabilities'
          - '--disable-pcp'
          - '--disable-static'
        environ:
          PKG_CONFIG_LIBDIR: '@SYSROOT_DIR@/usr/lib/pkgconfig:@SYSROOT_DIR@/usr/share/pkgconfig'
          PKG_CONFIG_SYSROOT_DIR: '@SYSROOT_DIR@'
    build:
      - args: ['make', '-j@PARALLELISM@']
    install:
      - args: ['make', 'DESTDIR=@SYSROOT_DIR@', 'install']
      - args: |
          mkdir -p @SYSROOT_DIR@/usr/bin
          cp -f htop @SYSROOT_DIR@/usr/bin/htop
