sources:
  - name: pkg-config
    subdir: sources
    url: 'https://pkgconfig.freedesktop.org/releases/pkg-config-0.29.2.tar.gz'
    format: 'tar.gz'
    extract_path: 'pkg-config-0.29.2'
    version: '0.29.2'
    patch_path_strip: 1
    tools_required:
      - host-automake-v1.16
    regenerate:
      - args: ['cp',
               '@BUILD_ROOT@/tools/host-automake-v1.16/share/automake-1.16/config.sub',
               '@THIS_SOURCE_DIR@/']

packages:
  - name: pkg-config
    architecture: x86_64
    from_source: pkg-config
    tools_required:
      - host-gcc
      - host-autoconf-v2.69
      - host-automake-v1.16
      - host-libtool
    pkgs_required:
      - mlibc
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-petra'
          - '--prefix=/usr'
          - '--with-internal-glib'
          - '--disable-host-tool'
          - 'glib_cv_stack_grows=no'
          - 'glib_cv_uscore=no'
          - 'glib_cv_have_qsort_r=no'
          - 'glib_cv_va_val_copy=yes'
          - 'ac_cv_func_posix_getpwuid_r=yes'
          - 'ac_cv_func_posix_getgrgid_r=yes'
          - 'glib_cv_working_bcopy=no'
    build:
      - args: ['make', '-j@PARALLELISM@']
    install:
      - args: ['make', 'DESTDIR=@SYSROOT_DIR@', 'install-strip']
