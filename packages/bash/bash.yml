sources:
  - name: bash
    subdir: sources
    url: https://ftp.fau.de/gnu/bash/bash-5.3.tar.gz
    format: tar.gz
    extract_path: bash-5.3
    patch_path_strip: 1

packages:
  - name: bash
    architecture: x86_64
    from_source: bash
    tools_required:
      - host-gcc
    pkgs_required:
      - mlibc
      - ncurses
      - readline
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - --host=x86_64-petra
          - --prefix=/usr
          - --without-bash-malloc
          - --disable-nls
          - --with-installed-readline
          - CC_FOR_BUILD=gcc -std=gnu89
          - CFLAGS_FOR_BUILD=-O2 -std=gnu89
          - bash_cv_job_control_missing=present
          - bash_cv_sys_named_pipes=present
          - bash_cv_func_sigsetjmp=present
          - bash_cv_getcwd_malloc=yes
    build:
      - args:
          - make
          - -j@PARALLELISM@
    install:
      - args:
          - make
          - DESTDIR=@SYSROOT_DIR@
          - install
      - args:
          - ln
          - -sf
          - bash
          - '@SYSROOT_DIR@/usr/bin/sh'
