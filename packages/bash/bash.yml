sources:
  - name: bash
    url: https://ftp.gnu.org/gnu/bash/bash-5.2.tar.gz
    format: tar.gz

packages:
  - name: bash
    architecture: x86_64
    from_source: bash
    pkgs_required:
      - mlibc
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - --host=x86_64-linux-gnu
          - --prefix=/usr
          - --without-bash-malloc
          - --disable-nls
          - CC=x86_64-linux-gnu-gcc
          - CFLAGS=--sysroot=@SYSROOT_DIR@ -O2
          - LDFLAGS=--sysroot=@SYSROOT_DIR@
    build:
      - args:
          - make
          - -j@PARALLELISM@
    install:
      - args:
          - make
          - DESTDIR=@SYSROOT_DIR@
          - install
      - args:
          - ln
          - -sf
          - /usr/bin/bash
          - '@SYSROOT_DIR@/usr/bin/sh'
