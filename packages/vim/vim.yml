sources:
  - name: vim
    subdir: sources
    url: 'https://github.com/vim/vim/archive/refs/tags/v9.1.0000.tar.gz'
    format: 'tar.gz'
    extract_path: 'vim-9.1.0000'
    version: '9.1.0000'

packages:
  - name: vim
    architecture: x86_64
    from_source: vim
    tools_required:
      - host-gcc
    pkgs_required:
      - mlibc
      - ncurses
      - pkg-config
    configure:
      - args: ['cp', '-r', '@THIS_SOURCE_DIR@/.', '@THIS_BUILD_DIR@/']
      - args:
          - './configure'
          - '--host=x86_64-petra'
          - '--prefix=/usr'
          - '--sysconfdir=/etc'
          - '--with-tlib=ncursesw'
          - '--without-x'
          - '--disable-gui'
          - '--disable-nls'
          - '--disable-gpm'
          - '--disable-sysmouse'
          - '--disable-acl'
          - '--disable-selinux'
          - '--disable-canberra'
          - '--disable-libsodium'
          - '--enable-multibyte'
          - '--with-features=normal'
        workdir: '@THIS_BUILD_DIR@/src'
        environ:
          CFLAGS: '-O2 -pipe --sysroot=@SYSROOT_DIR@ -I@SYSROOT_DIR@/usr/include/ncursesw -I@SYSROOT_DIR@/usr/include'
          LDFLAGS: '--sysroot=@SYSROOT_DIR@ -L@SYSROOT_DIR@/usr/lib'
          LIBS: '-ltinfow'
          vim_cv_terminfo: 'yes'
          vim_cv_tgetent: 'zero'
          vim_cv_toupper_broken: 'no'
          vim_cv_getcwd_broken: 'no'
          vim_cv_stat_ignores_slash: 'yes'
          vim_cv_memmove_handles_overlap: 'yes'
          vim_cv_memcpy_handles_overlap: 'yes'
          vim_cv_bcopy_handles_overlap: 'yes'
    build:
      - args: ['make', '-C', 'src', '-j@PARALLELISM@']
    install:
      - args: |
          make -C src DESTDIR=@SYSROOT_DIR@ install
          ln -sf vim @SYSROOT_DIR@/usr/bin/vi
          mkdir -p @SYSROOT_DIR@/bin
          ln -sf /usr/bin/vim @SYSROOT_DIR@/bin/vim 2>/dev/null || true
          ln -sf /usr/bin/vi @SYSROOT_DIR@/bin/vi 2>/dev/null || true
