sources:
  - name: sed
    subdir: sources
    url: 'https://mirror.ibcp.fr/pub/gnu/sed/sed-4.10.tar.xz'
    format: tar.xz
    extract_path: 'sed-4.10'
    version: '4.10'
    patch_path_strip: 1

packages:
  - name: sed
    architecture: x86_64
    from_source: sed
    tools_required:
      - host-gcc
    pkgs_required:
      - mlibc
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-petra'
          - '--prefix=/usr'
          - '--disable-nls'
          - '--disable-acl'
          - '--without-selinux'
    build:
      # Build and install only po and . (skipping gnulib-tests which fails on non-glibc).
      # Using SUBDIRS="po ." ensures BUILT_SOURCES are generated before objects in .
      - args: ['make', '-j@PARALLELISM@', 'SUBDIRS=po .']
      - args: ['make', 'DESTDIR=@SYSROOT_DIR@', 'SUBDIRS=po .', 'install']

