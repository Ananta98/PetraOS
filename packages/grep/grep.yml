sources:
  - name: grep
    subdir: sources
    url: 'https://mirror.ibcp.fr/pub/gnu/grep/grep-3.11.tar.xz'
    format: tar.xz
    extract_path: 'grep-3.11'
    version: '3.11'
    patch_path_strip: 1

packages:
  - name: grep
    architecture: x86_64
    from_source: grep
    tools_required:
      - host-gcc
    pkgs_required:
      - mlibc
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-petra'
          - '--prefix=/usr'
          - '--disable-nls'
          - '--disable-perl-regexp'
          - '--disable-rpath'
    build:
      - args: ['make', '-j@PARALLELISM@']
      # NOTE: xbstrap 0.36 `Build` only executes `configure`+`build`
      # (package `install:` steps are parsed but never run), so install
      # directly here via DESTDIR. Keep `install:` below for compat
      # with fixed xbstrap / documentation.
      - args: ['make', 'DESTDIR=@SYSROOT_DIR@', 'install-strip']
    install:
      - args: ['make', 'DESTDIR=@SYSROOT_DIR@', 'install-strip']
