sources:
  - name: binutils
    subdir: sources
    git: 'git://sourceware.org/git/binutils-gdb.git'
    tag: 'binutils-2_38'
    version: '2.38'
    patch_path_strip: 1
    tools_required:
      - host-autoconf-v2.69
      - host-automake-v1.16
    regenerate:
      - args: ['cp',
               '@BUILD_ROOT@/tools/host-automake-v1.16/share/automake-1.16/config.sub',
               '@THIS_SOURCE_DIR@/']

tools:
  - name: host-binutils
    architecture: x86_64
    from_source: binutils
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--prefix=@PREFIX@'
          - '--target=x86_64-petra'
          - '--with-sysroot=@SYSROOT_DIR@'
          - '--disable-werror'
          - '--enable-targets=x86_64-elf,x86_64-pe'
          - 'CFLAGS=-O2 -pipe'
    compile:
      - args: ['make', '-j@PARALLELISM@', 'all-binutils', 'all-gas', 'all-ld']
    install:
      - args: ['make', 'install-strip-binutils', 'install-strip-gas', 'install-strip-ld']

packages:
  - name: binutils
    architecture: x86_64
    from_source: binutils
    tools_required:
      - host-gcc
    pkgs_required:
      - mlibc
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-petra'
          - '--prefix=/usr'
          - '--target=x86_64-petra'
          - '--with-sysroot=/'
          - '--disable-nls'
          - '--disable-werror'
    build:
      - args: ['make', '-j@PARALLELISM@', 'all-binutils', 'all-gas', 'all-ld']
    install:
      - args: ['make', 'DESTDIR=@SYSROOT_DIR@', 'install-strip-binutils', 'install-strip-gas', 'install-strip-ld']
