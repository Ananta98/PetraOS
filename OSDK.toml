[boot]
method = "qemu-direct"

[grub]
boot_protocol = "linux"

[run.boot]
kcmd_args = [
    "SHELL=/bin/bash",
    "LOGNAME=root",
    "HOME=/root",
    "USER=root",
    "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/libexec",
    "init=/init",
]
init_args = ["sh", "-l"]
initramfs = "build/initramfs.cpio"

[qemu]
args = "$(./scripts/qemu_args.sh)"