[boot]
method = "qemu-direct"

[grub]
boot_protocol = "linux"

[run.boot]
kcmd_args = [
    "SHELL=/bin/sh",
    "LOGNAME=root",
    "HOME=/",
    "USER=root",
    "PATH=/bin:/sbin",
    "init=/init",
]
init_args = ["sh", "-l"]
initramfs = "build/initramfs.cpio"

[qemu]
args = """\
    -machine q35,kernel-irqchip=split \
    -cpu host \
    --no-reboot \
    -enable-kvm \
    -m 8G \
    -smp 4 \
    -vga std \
    -device virtio-gpu-pci \
    -serial stdio \
    -chardev socket,id=mon0,path=/tmp/petra_qemu_monitor.sock,server=on,wait=off \
    -mon chardev=mon0,mode=readline \
    -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
    -device ich9-ahci,id=ahci \
    -drive id=ext4,file=build/ext4.img,format=raw,if=none \
    -device ide-hd,drive=ext4,bus=ahci.0 \
    -drive id=exfat,file=build/exfat.img,format=raw,if=none \
    -device ide-hd,drive=exfat,bus=ahci.1 \
    -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
    -drive if=pflash,format=raw,unit=1,file=/usr/share/OVMF/OVMF_VARS_4M.fd \
"""